<script id="v62-2-financial-logistics-engine">
(function(){'use strict';
 const moneyExact=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0);
 function inventoryRows(){return(S.raw.DEPOSITO||[]).map(r=>({material:mat(key(r,['Material'])),desc:key(r,['Texto breve material']),qty:num(key(r,['Utilizacao livre'])),value:num(key(r,['Val.utiliz.livre'])),currency:key(r,['Moeda'])})).filter(x=>x.material)}
 function inventoryFinancial(){let map={};inventoryRows().forEach(r=>{let x=map[r.material]??={material:r.material,desc:r.desc,qty:0,value:0};x.qty+=r.qty;x.value+=r.value;x.desc=x.desc||r.desc});let rows=Object.values(map).sort((a,b)=>b.value-a.value),total=rows.reduce((t,x)=>t+x.value,0),acc=0,abc={A:{count:0,value:0},B:{count:0,value:0},C:{count:0,value:0}};rows.forEach(x=>{let before=total?acc/total:0,k=before<.80?'A':before<.95?'B':'C';abc[k].count++;abc[k].value+=x.value;acc+=x.value});let top10=rows.slice(0,10).reduce((t,x)=>t+x.value,0);return{rows,total,abc,top10,top10Pct:total?top10/total*100:0,positive:rows.filter(x=>x.value>0).length,zero:rows.filter(x=>x.value===0).length,negative:rows.filter(x=>x.value<0).length}}
 function adminHtml(a,m){let f=inventoryFinancial(),missing=a.filter(x=>x.sap>0&&x.physical===0).reduce((t,x)=>t+(x.value||0),0),exposure=m.impact||0,ratio=f.total?exposure/f.total*100:0,colors={A:'var(--red)',B:'var(--amber)',C:'var(--green)'},max=Math.max(1,...f.rows.slice(0,8).map(x=>x.value));return `<section class="financeAdmin"><div class="financeAdminCard primary" style="--fc:var(--cyan)"><small>Valor total administrado</small><b>${moneyExact(f.total)}</b><span>3DEPOSITO · columna M · Val.utiliz.livre · ${fmt(f.rows.length)} materiales</span></div><div class="financeAdminCard" style="--fc:var(--blue)"><small>Exposición estimada</small><b>${moneyExact(exposure)}</b><span>Diferencias físicas valorizadas · ${pct(ratio)} del total</span></div><div class="financeAdminCard" style="--fc:var(--amber)"><small>Valor no localizado</small><b>${moneyExact(missing)}</b><span>Saldo SAP con físico igual a cero</span></div><div class="financeAdminCard" style="--fc:var(--red)"><small>Concentración Top 10</small><b>${pct(f.top10Pct)}</b><span>${moneyExact(f.top10)} concentrados en diez materiales</span></div></section><section class="financePanels"><article class="financePanel"><h3>Clasificación ABC por valor</h3><p>Prioridad para conteo cíclico, seguridad y control de movimientos.</p><div class="abcFinance">${['A','B','C'].map(k=>`<div style="--abc:${colors[k]}"><small>Clase ${k}</small><b>${moneyExact(f.abc[k].value)}</b><span>${fmt(f.abc[k].count)} materiales · ${pct(f.total?f.abc[k].value/f.total*100:0)}</span></div>`).join('')}</div></article><article class="financePanel"><h3>Materiales de mayor valor</h3><p>Concentración económica del inventario disponible.</p><div class="valueRows">${f.rows.slice(0,8).map(x=>`<div class="valueRow"><span>${esc(x.material)}</span><span class="valueTrack"><i style="width:${x.value/max*100}%"></i></span><span class="valueNumber">${moneyExact(x.value)}</span></div>`).join('')}</div></article></section><div class="financeNote"><b>Base financiera:</b> la suma se calcula dinámicamente desde la hoja 3DEPOSITO, columna M. El valor total administrado no es lo mismo que la exposición por divergencias. Con el libro actual, la base esperada es <b>R$ 14.764.846,03</b>.</div>`}
 function enhance(name,includePanels){let original=window[name];if(typeof original!=='function')return;window[name]=function(a,m){let html=original(a,m),extra=adminHtml(a,m);let marker='<div class="grid">';if(html.includes(marker))html=html.replace(marker,marker+extra);return html}}
 enhance('control',true);enhance('moneyView',true);
})();
